<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This file contains the forms for this HW assignment">
    <link rel="stylesheet" href="styles.css">
    <title>Forms page for the Kitchen Sink HW</title>
</head>
<body>
    <header>
        <h1>Forms Page</h1>
        <nav>
            <ul>
                <li><a href="deprecated.html">Deprecated</a></li>
                <li><a href="experiments.html">Experiments</a></li>
                <li><a href="index.html">Index</a></li>
                <li><a href="media.html">Media</a></li>
                <li><a href="structure.html">Structure</a></li>
                <li><a href="tables.html">Tables</a></li>
                <li><a href="text.html">Text</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <form action="#" method="post" enctype="multipart/form-data" novalidate>
            <fieldset>
                <legend>Account Registration</legend>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required minlength="3">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" autocomplete="email">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" autocomplete="new-password">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">
                <label for="website">Website:</label>
                <input type="url" id="website" name="website">
                <label for="search">Search:</label>
                <input type="search" id="search" name="search">
            </fieldset>

            <fieldset>
                <legend>Security Assessment</legend>
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" min="18" max="99" step="1">
                <label for="threat-level">Threat Level:</label>
                <input type="range" id="threat-level" name="threat-level" min="0" max="100" step="1" oninput="document.getElementById('threat-output').value = this.value">
                <output id="threat-output" for="threat-level">50</output>
                <label for="incident-date">Incident Date:</label>
                <input type="date" id="incident-date" name="incident-date">
                <label for="incident-time">Incident Time:</label>
                <input type="time" id="incident-time" name="incident-time">
                <label for="incident-datetime">Incident Date and Time:</label>
                <input type="datetime-local" id="incident-datetime" name="incident-datetime">
                <label for="incident-month">Incident Month:</label>
                <input type="month" id="incident-month" name="incident-month">
                <label for="incident-week">Incident Week:</label>
                <input type="week" id="incident-week" name="incident-week">
                <label for="alert-color">Alert Color:</label>
                <input type="color" id="alert-color" name="alert-color">
            </fieldset>

            <fieldset>
                <legend>Incident Report Options</legend>
                <label for="evidence">Upload Evidence:</label>
                <input type="file" id="evidence" name="evidence" accept=".pdf,.jpg,.png" multiple>
                <p>Affected Systems:</p>
                <label><input type="checkbox" name="systems" value="firewall" checked> Firewall</label>
                <label><input type="checkbox" name="systems" value="ids"> IDS</label>
                <label><input type="checkbox" name="systems" value="vpn"> VPN</label>
                <p>Threat Severity:</p>
                <label><input type="radio" name="severity" value="low"> Low</label>
                <label><input type="radio" name="severity" value="medium"> Medium</label>
                <label><input type="radio" name="severity" value="high"> High</label>
                <label for="os">Operating System:</label>
                <input type="text" id="os" name="os" list="os-list">
                <datalist id="os-list">
                    <option value="Windows 11">
                    <option value="Ubuntu 24">
                    <option value="macOS Sequoia">
                    <option value="Kali Linux">
                </datalist>
                <input type="hidden" name="form-version" value="1.0">
            </fieldset>

            <fieldset>
                <legend>Incident Details</legend>
                <label for="description">Incident Description:</label>
                <textarea id="description" name="description" rows="5" cols="40" maxlength="500" placeholder="Describe the incident..."></textarea>
                <label for="attack-type">Attack Type:</label>
                <select id="attack-type" name="attack-type">
                    <optgroup label="Network Attacks">
                        <option value="ddos">DDoS</option>
                        <option value="mitm" selected>Man-in-the-Middle</option>
                    </optgroup>
                    <optgroup label="Social Engineering">
                        <option value="phishing">Phishing</option>
                        <option value="pretexting">Pretexting</option>
                    </optgroup>
                </select>
                <label for="threat-score">Threat Score:</label>
                <meter id="threat-score" min="0" max="100" value="75" low="30" high="70" optimum="10">75</meter>
                <label for="scan-progress">Scan Progress:</label>
                <progress id="scan-progress" value="60" max="100">60%</progress>
                <label>Indeterminate Progress:</label>
                <progress></progress>
                <label for="notes">Readonly Notes:</label>
                <input type="text" id="notes" name="notes" value="Auto-generated report" readonly>
                <label for="disabled-field">Disabled Field:</label>
                <input type="text" id="disabled-field" name="disabled-field" value="N/A" disabled>
                <input type="image" src="assets/locks.jpg" alt="Submit" width="100">
                <input type="hidden" name="report-id" value="RPT-2026-001">
                <button type="submit" tabindex="1" autofocus >Submit Report</button>
                <button type="reset" tabindex="2">Reset Form</button>
                <button type="button" tabindex="3">Save Draft</button>
            </fieldset>

            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
            <input type="button" value="Click Me">
        </form>
    </main>
    <footer>
        <p>&copy; 2026 William Blanco. All rights reserved.</p>
    </footer>
</body>
</html>
